name: CI — Nagar Kuraiteer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node-preview:
    name: Node Preview Runtime (Lint & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint and syntax checks
        run: npm run lint

      - name: Run Node API and accessibility test suite
        run: npm test

  python-reference:
    name: FastAPI Reference Backend (Ruff, Mypy & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TN_Govt_assisting_chatbot-main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: TN_Govt_assisting_chatbot-main/backend/requirements.txt

      - name: Install Python dependencies and linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx ruff mypy

      - name: Lint with Ruff
        run: ruff check backend

      - name: Static type check with Mypy
        run: mypy backend/app

      - name: Run Pytest suite (core, security hardening, accessibility)
        env:
          LLM_MODE: mock
        run: python -m pytest backend/tests
